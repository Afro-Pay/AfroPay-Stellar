version: "3.9"

# =============================================================================
# AfroPay-Stellar — Docker Compose (Local Development)
# =============================================================================
# ⚠ SECURITY NOTES ⚠
# 1. The secrets below are DEVELOPMENT defaults. Never use in production.
# 2. For production, use a secrets manager (Vault, AWS Secrets Manager, etc.)
#    or a .env file with restricted permissions (chmod 600).
# 3. PostgreSQL and Redis ports are exposed to the host for convenience.
#    In production, remove `ports` or bind to 127.0.0.1 only.
# 4. Generate real secrets before any public deployment:
#    - JWT_SECRET: openssl rand -base64 48
#    - ENCRYPTION_KEY: openssl rand -hex 32
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: afropay
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: afropay_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remitx -d remitx"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # NestJS API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://remitx:remitx@postgres:5432/remitx
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_in_production
      # Replace with a random 32-byte hex master key before deployment.
      ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      ANCHOR_USDC_URL: https://testanchor.stellar.org
      ANCHOR_NGN_URL: https://testanchor.stellar.org
      FRAUD_SERVICE_URL: http://python-analytics:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:3001/health\", ()=>process.exit(0)).on(\"error\", ()=>process.exit(1))' "]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Next.js Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:3000\", ()=>process.exit(0)).on(\"error\", ()=>process.exit(1))' "]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  rust-worker:
    build:
      context: ./services/rust-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      METRICS_PORT: ${METRICS_PORT:-9898}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[w]orker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  python-analytics:
    build:
      context: ./services/python-analytics
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request, sys; urllib.request.urlopen(\"http://127.0.0.1:8000/health\"); sys.exit(0)' "]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =============================================================================
  # mock-anchor — lightweight in-process SEP-6/24 anchor for E2E tests.
  #
  # Activate with the `test` profile:
  #   docker compose --profile test up mock-anchor
  #
  # The api service (when running under the test profile) should set:
  #   ANCHOR_USDC_URL: http://mock-anchor:4100
  #   ANCHOR_NGN_URL:  http://mock-anchor:4100
  # =============================================================================
  mock-anchor:
    image: node:20-alpine
    profiles:
      - test
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "4100:4100"
    environment:
      PORT: 4100
      NODE_ENV: test
    working_dir: /app
    volumes:
      - ./apps/api/test/e2e:/app/e2e:ro
    # Inline Node.js server — no build step needed.
    # Serves the same SEP-6 endpoints as the in-process mock-anchor.ts.
    command: >
      sh -c "
        node -e \"
          const http = require('http');
          const PORT = parseInt(process.env.PORT || '4100');

          const ROUTES = {
            '/sep6/deposit'(url, res) {
              const p = new URLSearchParams(url.split('?')[1] || '');
              const account = p.get('account') || '';
              const asset = p.get('asset_code') || 'USDC';
              json(res, 200, {
                how: 'Bank transfer to Account #123456',
                eta: 1800, fee_fixed: 1.0, fee_percent: 0,
                min_amount: 10, max_amount: 10000,
                asset_code: asset, stellar_account: account,
              });
            },
            '/sep6/withdraw'(url, res) {
              const p = new URLSearchParams(url.split('?')[1] || '');
              const asset = p.get('asset_code') || 'USDC';
              const amount = parseFloat(p.get('amount') || '0');
              if (amount > 0 && amount < 10) return json(res, 400, { error: 'Below minimum', min_amount: 10 });
              if (amount > 10000) return json(res, 400, { error: 'Exceeds maximum', max_amount: 10000 });
              json(res, 200, {
                account_id: 'GANCHOR000000000000000000000000000000000000000000000000001',
                memo_type: 'text', memo: 'withdraw-' + Date.now(),
                fee_fixed: 0.5, fee_percent: 0,
                min_amount: 10, max_amount: 10000, asset_code: asset, eta: 600,
              });
            },
            '/.well-known/stellar.toml'(url, res) {
              res.writeHead(200, { 'Content-Type': 'text/plain' });
              res.end([
                'NETWORK_PASSPHRASE=\\\"Test SDF Network ; September 2015\\\"',
                'SIGNING_KEY=\\\"GBMOCK_ANCHOR_SIGNING_KEY_TEST_ONLY_000000000000000000001\\\"',
              ].join('\n'));
            },
          };

          function json(res, status, body) {
            res.writeHead(status, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify(body));
          }

          const srv = http.createServer((req, res) => {
            const path = (req.url || '/').split('?')[0];
            const handler = ROUTES[path];
            if (handler) return handler(req.url, res);
            json(res, 404, { error: 'Not found' });
          });

          srv.listen(PORT, '0.0.0.0', () => console.log('mock-anchor listening on ' + PORT));
        \"
      "
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:4100/sep6/deposit?asset_code=USDC&account=test\", r => { r.statusCode < 500 ? process.exit(0) : process.exit(1); }).on(\"error\", () => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:
