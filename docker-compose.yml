version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: afropay-postgres
    environment:
      POSTGRES_USER: afropay
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: afropay_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/prisma/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afropay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: afropay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: afropay-api
    environment:
      DATABASE_URL: postgresql://afropay:${DB_PASSWORD:-dev_password}@postgres:5432/afropay_dev
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_NETWORK: testnet
      SOROBAN_CONTRACT_ADDRESS: ${SOROBAN_CONTRACT_ADDRESS}
      SOROBAN_ADMIN_KEY: ${SOROBAN_ADMIN_KEY}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key}
      FRAUD_SERVICE_URL: http://fraud:8001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: afropay-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Python Fraud Detection Service
  fraud:
    build:
      context: ./services/python-analytics
      dockerfile: Dockerfile
    container_name: afropay-fraud
    environment:
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: info
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Rust Background Worker
  worker:
    build:
      context: ./services/rust-worker
      dockerfile: Dockerfile
    container_name: afropay-worker
    environment:
      REDIS_URL: redis://redis:6379
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_NETWORK: testnet
      RUST_LOG: info
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: afropay-network
