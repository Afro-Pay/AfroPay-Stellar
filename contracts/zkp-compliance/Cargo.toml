[package]
name = "zkp-compliance"
version = "0.1.0"
edition = "2021"
description = "zk-SNARK (groth16) circuit for privacy-preserving AML compliance auditing (AfroPay issue #271)"
license = "Apache-2.0"

# Standalone crate — detached from the parent soroban workspace so the arkworks
# dependency graph does not pollute the Stellar contract build.
[workspace]

[dependencies]
ark-ff = "0.4"
ark-ec = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-bls12-381 = "0.4"
ark-groth16 = "0.4"
ark-snark = "0.4"
ark-crypto-primitives = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"
rand = "0.8"

[dev-dependencies]
rand_chacha = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
